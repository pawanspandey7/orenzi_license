[project]
name = "orenzi_license"
authors = [
    { name = "GreenAdvise Technologies Private Limited", email = "dev@orenzi.example" }
]
description = "Orenzi licence agent: the signed plan from app.orenzi.in, feature gates, limits, read-only on suspension and usage reports, for every Orenzi product site"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=16.0.0" # Installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
